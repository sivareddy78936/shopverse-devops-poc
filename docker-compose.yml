services:

  mysql:
    image: mysql:8.0
    container_name: shopverse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopverse}
      MYSQL_USER: ${MYSQL_USER:-shopverse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shopverse-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    image: shopverse-backend:${IMAGE_TAG:-latest}
    container_name: shopverse-backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-shopverse}
      DB_USER: ${MYSQL_USER:-shopverse}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-localhost}
      PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shopverse-network
    restart: unless-stopped

  frontend:
    image: shopverse-frontend:${IMAGE_TAG:-latest}
    container_name: shopverse-frontend
    depends_on:
      backend:
        condition: service_started
    networks:
      - shopverse-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - \"$(printf 'http://%s/health' 127.0.0.1)\" >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: shopverse-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - shopverse-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - \"$(printf 'http://%s/health' 127.0.0.1)\" >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
    name: shopverse_mysql_data

networks:
  shopverse-network:
    name: shopverse-network
    driver: bridge
